
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin" // 替换原 Flutter 插件的 apply from 方式
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '2'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.2'
}

android {
    namespace "com.arvin.flutter_parse_html"
    ndkVersion = "29.0.14033849"
//    packagingOptions {
//        // Fixes duplicate libraries build issue,
//        // when your project uses more than one plugin that depend on C++ libs.
//        pickFirst 'lib/**/libc++_shared.so'
//    }
    compileSdkVersion 35
//    ndkVersion '21.3.6528147'

    defaultConfig {
        applicationId "com.arvin.flutter_parse_html"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk {
            //设置支持的SO库架构
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
    signingConfigs {
        debugConfig {
            storeFile file("../key.keystore")
            storePassword "123456"
            keyAlias "key0"
            keyPassword "123456"
        }
        releaseConfig {
            storeFile file("../key.keystore")
            storePassword "123456"
            keyAlias "key0"
            keyPassword "123456"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            signingConfig android.signingConfigs.releaseConfig
            shrinkResources true
            minifyEnabled true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.7.0"
    }
}


flutter {
    source '../..'
}

dependencies {
//    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation files('libs/tbs_sdk_thirdapp_v4.3.0.151_44051_sharewithdownloadwithfile_withoutGame_obfs_20210524_174029.jar')
    testImplementation 'junit:junit:4.12'
    implementation("com.squareup.okhttp3:okhttp:4.9.0")
    implementation 'androidx.multidex:multidex:2.0.1'
//    implementation 'com.ldoublem.loadingview:loadingviewlib:1.0'
    implementation 'androidx.appcompat:appcompat:1.5.0'
    //完整版引入

    implementation 'io.github.carguo:gsyvideoplayer:11.1.0'


//是否需要AliPlayer模式
    implementation 'io.github.carguo:gsyvideoplayer-aliplay:11.1.0'


    //是否需要AliPlayer模式
//    implementation 'com.github.CarGuo.GSYVideoPlayer:GSYVideoPlayer-aliplay:v8.3.5-release-jitpack'

}
